    <style>
        /* --- Styles from your Zhian homepage (indexz.html) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f9f5;
            color: #2d3a2d;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }
        
        .header { /* Added a simple header for context, can be removed if not needed */
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 42px;
            color: #2d6a4f;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        
        .header .tagline {
            font-size: 15px;
            color: #52b788;
            font-style: italic;
        }
        
        .menu {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        
        .menu-card {
            background: white;
            border-radius: 16px;
            padding: 22px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 2px 10px rgba(45, 106, 79, 0.08);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            text-decoration: none;
            color: inherit;
        }
        
        .menu-card:active {
            transform: scale(0.98);
            box-shadow: 0 1px 5px rgba(45, 106, 79, 0.12);
        }
        
        .menu-icon {
            font-size: 32px;
            width: 50px;
            height: 50px;
            background: #e8f5e9;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .menu-info h3 {
            font-size: 18px;
            color: #2d6a4f;
            margin-bottom: 4px;
        }
        
        .menu-info p {
            font-size: 13px;
            color: #6b7f6b;
        }
        
        .menu-arrow {
            margin-left: auto;
            font-size: 20px;
            color: #52b788;
        }
        
        .footer { /* Added a simple footer for context */
            text-align: center;
            margin-top: 35px;
            font-size: 12px;
            color: #8aa88a;
        }

        /* --- Specific styles for the 'Others' page --- */
        .page-title {
            font-size: 28px;
            color: #2d6a4f;
            margin-bottom: 8px;
            text-align: center; /* Center the title */
            margin-top: 20px; /* Add some space above the title */
        }

        .page-subtitle {
            font-size: 14px;
            color: #6b7f6b;
            margin-bottom: 24px;
            text-align: center; /* Center the subtitle */
        }

        .back-btn { /* Style for the back button */
            background: none;
            border: none;
            font-size: 18px;
            color: #2d6a4f;
            cursor: pointer;
            padding: 10px 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .back-btn:active {
            opacity: 0.6;
        }
        /* --- End of specific styles --- */

    </style>
</head>
